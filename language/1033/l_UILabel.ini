[UI_PRIVACY_POLICY]
UI_PRIVACY_POLICY_TITLE="Security assistant privacy policy"
UI_PRIVACY_POLICY_CONTENT="<html>    <body>    <p>    This privacy policy is only applicable to the security assistant and related services provided by Shenzhen leagsoft Technology Co., Ltd. (hereinafter referred to as "we"). We will obtain necessary personal information according to the agreement and strictly protect your privacy and personal information. This privacy policy applies to all situations where you use the terminal client services provided by us.</p>    <p>    This privacy policy will help you understand the following：</p>    <p>    1. What information do we collect</p>    <p>    2. Information storage</p>    <p>    3. Information protection measures</p>    <p>    4. How do we use your information</p>    <p>    5. Share your information</p>    <p>    6. Policy revision</p>    <p>    7. Suggestion feedback</p>    <p>    </p>        <p>    Details of the privacy policy are as follows：</p> <b>    1. What information do we collect</b>    <p>    In order to provide you with better services, we can collect the information you provide or generated during your use of our services in the following ways：</p>    <p>    According to the organization structure synchronization information provided by your company, we can get your email, password, mobile phone number, etc. After you log in to the client, we will collect the information of the terminal according to the basic strategy, such as IP, host name, MAC address, etc. We are fully aware that email, password, mobile phone number, IP, host name and MAC address are sensitive information; We collect such information in the form required by relevant laws and regulations. If you refuse to provide such information, you may refuse network access or terminal related functions.</p><b>    2. Information storage</b>    <p>    We strictly abide by laws and regulations and agreements with users, and use the information we collect for the following purposes. If we use your personal information for other purposes for the following purposes, we will explain it to you again and ask for your consent.</p>    <p>    The collected personal information is transmitted to and stored on our system server through the Intranet in an encrypted manner. The security level of our computer room management, server management and network management and the security of this terminal security management system are relatively high. We only retain your information for the purposes stated in this Privacy Policy and for the period specified by laws, regulations and regulations. Unless you choose or in accordance with relevant laws and regulations, we will not share the above information with any third party, nor will we use it for any purpose other than the specified purpose.</p><b>    3. Information protection measures</b>    <p>    We strive to ensure the security of users' personal information to prevent information loss, illegal use, unauthorized access or disclosure.</p>    <p>    We will use all types of security precautions at a reasonable level of security to protect your personal information. For example, we may use encryption technology (such as SSL) to protect your personal information.</p>    <p>    We will constantly improve our technology to prevent the disclosure of your personal information.</p>    <p>    We have established special management systems, procedures and organizations to ensure the security of information. For example, we strictly control the personnel who are allowed to access information, and these personnel must abide by the obligation of confidentiality.</p>    <p>    In case of any security incident (such as personal information disclosure), we will take emergency plans to prevent the expansion of the incident and notify you by push notification, announcement or any other means.</p><b>    4. How do we use your information</b>    <p>    In order to ensure that the service meets the needs of your company and help us better understand the terminal and policy results, we may record relevant information, such as your terminal equipment compliance inspection, security function usage, terminal operation audit, etc. If we use your personal information for non stated purposes or outside the scope of direct or reasonable connection, we will seek your express consent before use.</p><b>    5. Share your information</b>    <p>    We will not disclose any personal information we collect. If we must disclose such information under any circumstances, we will inform you of the purpose of this disclosure, the type of information to be disclosed and the sensitive information that may be involved, and obtain your express consent.</p>    <p>    In addition, according to relevant laws, regulations and national standards, we may disclose your information without your prior consent under the following circumstances：</p>    <p>    1) Directly related to national security or national defense;</p>    <p>    2) Directly related to public safety, public health or major public interests;</p>    <p>    3) Directly related to criminal investigation, litigation, judgment, etc</p>    <p>    4) In order to protect the main legitimate rights and interests, such as the life or property of personal information subjects or others, it is difficult to obtain their own consent;</p>    <p>    5) Personal information voluntarily shared by the subject of personal information to the public;</p>    <p>    6) Personal information collected from legally disclosed information (such as news reports or government issued information);</p>    <p>    7) Other circumstances stipulated by laws and regulations.</p><b>    6. Policy revision</b>    <p>    We will change this privacy policy from time to time. When the terms in this privacy policy are changed, we will show you the changed instructions through a pop-up window when you log in or update the version. Please note that we will collect, use and store your personal information according to the new privacy policy only when you click the "I agree" button in the pop-up window.</p><b>    7. Suggestion feedback</b>    <p>    If you have any suggestions for this application, please e-mail support@leagsoft.com Contact us for feedback. We will review the feedback as soon as possible and reply to it within fifteen (15) days after confirming your identity.</p>    </body>    </html>"

