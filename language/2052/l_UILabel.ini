UI_PRIVACY_POLICY_CONTENT="<html><body><p>    本隐私政策仅适用于“深圳市联软科技股份有限公司”提供的安全助手及相关服务（以下称为“我们”）。 我们会依协议获取必要的个人信息，并严格保护您的隐私和个人信息。本隐私政策适用于您使用我们提供的终端客户端服务的所有情况。</p><p>    本隐私政策将帮助您理解以下内容：</p><p>    1.我们收集什么信息</p><p>    2.信息存储</p><p>    3.信息保护措施</p><p>    4.我们如何使用您的信息</p><p>    5.分享您的信息</p><p>    6.政策修订</p><p>    7.建议反馈</p><p>    </p><p>    该隐私政策的详情如下：</p><b>    1、我们收集什么信息 </b><p>    为了向您提供更好的服务，我们可以通过以下方式收集您提供的信息或在您使用我们的服务期间生成的信息：</p><p>    依照贵单位提供的组织架构同步信息，我们可以获得您的邮箱、密码、手机号码等。待您登陆客户端后，我们将按照基础策略，收集终端的信息，如IP、主机名、MAC地址等。我们完全意识到，邮箱、密码、手机号码、IP、主机名、MAC地址是敏感信息；我们以符合相关法律法规所规定的形式收集此类信息，如果您拒绝提供此类信息，则可能会拒绝您网络访问或终端相关功能。</p><b>    2、信息存储</b><p>    我们严格遵守法律法规和与用户的协议，并将我们收集的信息用于以下目的。 如果我们出于以下目的将您的个人信息用于其他目的，我们将再次向您解释并征求您的同意。</p><p>    收集的个人信息以加密方式通过内网传输到并存储在我们的系统服务器上。 我们机房管理，服务器管理，网络管理的安全级别以及此终端安全管理系统安全性都比较高。 我们仅在本隐私政策所述目的以及法律，法规和监管规定的期限内保留您的信息。 除非您选择或根据相关法律法规的规定，否则我们不会与任何第三方共享以上信息，也不会将其用于指定目的之外的其他目的。</p><b>    3、信息保护措施</b><p>    我们努力保证用户个人信息的安全，以防止信息丢失，非法使用，未经授权访问或披露。</p><p>    我们将以合理的安全级别使用所有类型的安全预防措施，以保护您的个人信息。例如，我们可能使用加密技术（例如SSL）来保护您的个人信息。</p><p>    我们将通过不断改进技术来防止您的个人信息泄露。</p><p>    我们建立了专门的管理系统，程序和组织来保证信息的安全性。例如，我们严格控制被允许访问信息的人员，并且这些人员必须遵守保密义务。</p><p>    如果发生任何安全事件（例如个人信息泄露），我们将采取应急计划以阻止事件扩大，并通过推送通知，公告或任何其他方式通知您。</p><b>    4、我们如何使用您的信息</b><p>    为了确保服务对贵单位的需求满足，并帮助我们更好地了解终端及策略结果，我们可能会记录相关信息，例如您的终端设备合规性检查、安全功能使用状况、终端操作审计等。 如果我们将您的个人信息用于非陈述目的或直接或合理的关联范围之外，我们将在使用前征求您的明确同意。</p><b>    5、分享您的信息</b><p>    我们不会透露我们收集的任何个人信息。如果在任何情况下我们都必须披露此类信息，我们将通知您本披露的目的，要披露的信息类型以及可能涉及的敏感信息，并征得您的明确同意。</p><p>    1）直接关系到国家安全或国防；</p><p>    2）直接关系到公共安全，公共卫生或重大公共利益；</p><p>    3）与犯罪调查，诉讼，判决等直接相关</p><p>    4）为了维护主要的合法权益，例如个人信息主体或他人的生命或财产，而很难获得其本身的同意；</p><p>    5）个人信息的主体自愿分享给公众的个人信息；</p><p>    6）从合法披露的信息（例如新闻报道或政府发布的信息）中收集的个人信息；</p><p>    7）法律，法规规定的其他情形。</p><b>    6、政策修订</b><p>    我们会不时更改本隐私政策。当本隐私政策中的条款发生更改时，我们将在您登录或更新版本时通过弹出窗口向您显示更改后的说明。请注意，仅当您在弹出窗口中单击“我同意”按钮时，我们才会根据新的隐私政策收集，使用和存储您的个人信息。</p><b>    7、建议反馈</b><p>    如果您对此应用程序有任何建议，请发邮件到support@leagsoft.com反馈。 我们将尽快审核，并在确认您的身份后十五（15）天内回复。</p></body></html>"


